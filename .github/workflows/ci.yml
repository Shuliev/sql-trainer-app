name: CI

on:
  push:
    branches: [main, "feature/**", "bugfix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore sql-trainer-app.slnx

      - name: Build
        run: dotnet build sql-trainer-app.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test sql-trainer-app.slnx --no-build --configuration Release --logger "trx;LogFilePrefix=${{ matrix.os }}" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
